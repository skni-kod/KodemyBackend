server.port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/kodemy?currentSchema=kodemy-backend
    username: postgres
    password: postgres
  jpa.show-sql: true
  liquibase.contexts: dev,local
  rabbitmq:
    host: localhost

management:
  server:
    port: ${server.port}

logging.level:
  org.springframework.security: DEBUG

service:
  baseUrl:
    auth: http://localhost:8080

eureka:
  client:
    enabled: false