name: Pull Request - compile & test

on:
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.gitignore'
      - 'docker-compose.deploy.yml'
      - 'docker-compose.yml'
      - 'README.md'
      - 'config'
  workflow_call:

jobs:
  build:
    name: Build project
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Build with Gradle Wrapper
        run: |
          cd commons
          ./gradlew classes testClasses
          
          cd ../kodemy-api-gateway
          ./gradlew classes testClasses
          cd ../kodemy-auth
          ./gradlew classes testClasses
          cd ../kodemy-backend
          ./gradlew classes testClasses
          cd ../kodemy-search
          ./gradlew classes testClasses
          cd ../kodemy-notification
          ./gradlew classes testClasses
          cd ../kodemy-service-registry
          ./gradlew classes testClasses
        
  test:
    name: Run tests
    runs-on: self-hosted
    needs: [ build ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Test with Gradle Wrapper
        run: |
          cd commons
          ./gradlew test

          cd ../kodemy-api-gateway
          ./gradlew test
          cd ../kodemy-auth
          ./gradlew test
          cd ../kodemy-backend
          ./gradlew test
          cd ../kodemy-search
          ./gradlew test
          cd ../kodemy-notification
          ./gradlew test
          cd ../kodemy-service-registry
          ./gradlew test