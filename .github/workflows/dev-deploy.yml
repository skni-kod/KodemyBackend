name: DEV - Deploy

on:
  workflow_dispatch:
#on:
#  push:
#    branches: [ "dev-deploy" ] 

jobs:
  prepare:
    name: Prepare
    runs-on: self-hosted
    steps:
      - name: Check environment variables
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            REQUIRED_VARS=\
            (
              ${{ secrets.REMOTE_HOST }}
              ${{ secrets.REMOTE_USER }}
              ${{ secrets.REMOTE_PORT }}
              ${{ secrets.SSH_PRIVATE_KEY }}
              ${{ secrets.WORKING_DIRECTORY }}
              ${{ secrets.NETWORK_NAME }}
              ${{ secrets.DATASOURCE_CONTAINER }}
              ${{ secrets.DATASOURCE_USERNAME }}
              ${{ secrets.DATASOURCE_PASSWORD }}
              ${{ secrets.DATASOURCE_DATABASE }}
              ${{ secrets.RABBITMQ_HOST }}
              ${{ secrets.RABBITMQ_PORT }}
              ${{ secrets.RABBITMQ_USERNAME }}
              ${{ secrets.RABBITMQ_PASSWORD }}
              ${{ secrets.RABBITMQ_PASSWORD }}
              ${{ secrets.ELASTICSEARCH_USERNAME }}
              ${{ secrets.ELASTICSEARCH_PASSWORD }}
              ${{ secrets.EUREKA_URL }}
              ${{ secrets.FRONTEND_PUBLIC_HOST }}
              ${{ secrets.GATEWAY_PUBLIC_HOST }}
            )
            EXIT=0
            for VAR in "${REQUIRED_VARS[@]}"; do
              [ -z "${!VAR}" ] && echo "Environment variable $VAR is missing." && EXIT=1
            done
            exit $EXIT
            
            export DATASOURCE_CONTAINER=${{ secrets.DATASOURCE_CONTAINER }}
            export DATASOURCE_DATABASE=${{ secrets.DATASOURCE_DATABASE }}
            export DATASOURCE_PASSWORD=${{ secrets.DATASOURCE_PASSWORD }}
            export RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}
            export RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}
            export RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}
            export RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            export ELASTICSEARCH_HOSTS=${{ secrets.RABBITMQ_PASSWORD }}
            export ELASTICSEARCH_USERNAME=${{ secrets.ELASTICSEARCH_USERNAME }}
            export ELASTICSEARCH_PASSWORD=${{ secrets.ELASTICSEARCH_PASSWORD }}
            export EUREKA_URL=${{ secrets.EUREKA_URL }}
            export FRONTEND_PUBLIC_HOST=${{ secrets.FRONTEND_PUBLIC_HOST }}
            export GATEWAY_PUBLIC_HOST=${{ secrets.GATEWAY_PUBLIC_HOST }}
            export DATASOURCE_URL=jdbc:postgresql://$DATASOURCE_CONTAINER/$DATASOURCE_DATABASE
  checkout:
    name: Checkout $ Pull
    needs: [ prepare ]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export WORKING_DIRECTORY=${{ secrets.WORKING_DIRECTORY }}
            cd $WORKING_DIRECTORY
            
            git checkout dev || exit 1
            git pull || exit 1
  validate:
    name: Pre-deploy
    runs-on: self-hosted
    needs: [ checkout ]
    steps:
      - name: Validate
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NETWORK_NAME=${{ secrets.NETWORK_NAME }}
            export DATASOURCE_CONTAINER=${{ secrets.DATASOURCE_CONTAINER }}
            export DATASOURCE_USERNAME=${{ secrets.DATASOURCE_USERNAME }}
            export DATASOURCE_DATABASE=${{ secrets.DATASOURCE_DATABASE }}
            
            echo "Validate network"
            docker network inspect $NETWORK_NAME > /dev/null 2>&1 \
              || { echo "Network $NETWORK_NAME is not available."; exit 1; }
            
            echo "Validate database - container"
            docker exec -t $DATASOURCE_CONTAINER pg_isready \
              || { echo "PostgreSQL is not running."; exit 1; }
            
            echo "Validate database - database"
            docker exec -t $DATASOURCE_CONTAINER psql -lqt -U $DATASOURCE_USERNAME | grep -q $DATASOURCE_DATABASE \
              || { echo "Database $DATASOURCE_DATABASE does not exist."; exit 1; }
            
            echo "Validate database - schemas"
            SCHEMAS=("kodemy-auth" "kodemy-backend" "kodemy-notification")
            
            for SCHEMA in "${SCHEMAS[@]}"
            do
              docker exec -t $DATASOURCE_CONTAINER psql \
                -U $DATASOURCE_USERNAME \
                -d $DATASOURCE_DATABASE \
                -tAc "SELECT 1 FROM information_schema.schemata WHERE schema_name = '$SCHEMA'" \
                | grep -q 1 || { echo "Schema $SCHEMA does not exist."; exit 1; }
            done
  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: [ validate ]
    steps:
      - name: Build & deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export WORKING_DIRECTORY=${{ secrets.WORKING_DIRECTORY }}
            export DATASOURCE_USERNAME=${{ secrets.DATASOURCE_USERNAME }}
            export DATASOURCE_PASSWORD=${{ secrets.DATASOURCE_PASSWORD }}
            
            cd $WORKING_DIRECTORY
            
            cd /commons
            ./gradlew build
            
            cd $WORKING_DIRECTORY/kodemy-api-gateway
            ./gradlew build -x test
            cd $WORKING_DIRECTORY/kodemy-auth
            ./gradlew build -x test
            cd $WORKING_DIRECTORY/kodemy-backend
            ./gradlew build -x test
            cd $WORKING_DIRECTORY/kodemy-notification
            ./gradlew build -x test
            cd $WORKING_DIRECTORY/kodemy-search
            ./gradlew build -x test
            cd $WORKING_DIRECTORY/kodemy-service-registry
            ./gradlew build -x test
            
            cd $WORKING_DIRECTORY
            docker compose -f docker-compose.services.yml up --build -d
      - name: Cleanup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker system prune -f
